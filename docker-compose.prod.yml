# 生产环境 Docker Compose
# 使用方式: docker compose -f docker-compose.prod.yml --env-file .env.prod up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: utils-pg-prod
    restart: unless-stopped
    ports:
      - '5007:5432'
    environment:
      POSTGRES_USER: utils
      POSTGRES_PASSWORD: utils
      POSTGRES_DB: utils_plane
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U utils -d utils_plane']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: utils-redis-prod
    restart: unless-stopped
    ports:
      - '5008:6379'
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory-policy noeviction
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: utils-minio-prod
    restart: unless-stopped
    ports:
      - '5009:9000'
      - '5010:9001'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_API_CORS_ALLOW_ORIGIN: http://202.104.149.204:5005
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 30s
      timeout: 20s
      retries: 3

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb local/uploads --ignore-existing;
      mc anonymous set download local/uploads;
      mc mb local/models --ignore-existing;
      mc anonymous set download local/models;
      mc mb local/presets --ignore-existing;
      mc anonymous set download local/presets;
      exit 0;
      "

  api:
    image: utils-plane:all
    command:
      [
        'sh',
        '-c',
        'node apps/api/dist/scripts/migrate.js && node apps/api/dist/scripts/sync-id-photo-models.js && node apps/api/dist/scripts/seed-image-generate-presets.js && node apps/api/dist/main.js',
      ]
    ports:
      - '5006:3001'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://utils:utils@postgres:5432/utils_plane
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: uploads
      S3_FORCE_PATH_STYLE: 'true'
      S3_MODELS_BUCKET: ${S3_MODELS_BUCKET:-models}
      S3_PRESETS_BUCKET: ${S3_PRESETS_BUCKET:-presets}
      IMAGE_GENERATE_PRESETS_DIR: /app/public/presets
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      REQUIRE_EMAIL_VERIFICATION: ${REQUIRE_EMAIL_VERIFICATION:-true}
      EMAIL_VERIFICATION_CALLBACK_URL: ${EMAIL_VERIFICATION_CALLBACK_URL:-}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://202.104.149.204:5005}
      NODE_ENV: production
      PORT: 3001
      RELEASE: ${RELEASE:-prod}
      BUILD_COMMIT: ${BUILD_COMMIT:-unknown}
      BUILD_TIME: ${BUILD_TIME:-}
      # 证件照 AI 精修（可选）。默认值必须与 portrait-segmentation.service.ts 的
      # 代码默认一致：这里透传空串会覆盖掉 `?? 默认值`。
      ID_PHOTO_AI_SEGMENTATION_BASE_URL: ${ID_PHOTO_AI_SEGMENTATION_BASE_URL:-}
      ID_PHOTO_AI_SEGMENTATION_API_KEY: ${ID_PHOTO_AI_SEGMENTATION_API_KEY:-}
      ID_PHOTO_AI_SEGMENTATION_MODEL: ${ID_PHOTO_AI_SEGMENTATION_MODEL:-gpt-4o-mini}
      ID_PHOTO_AI_SEGMENTATION_PROVIDER: ${ID_PHOTO_AI_SEGMENTATION_PROVIDER:-chat_mask}
      ID_PHOTO_AI_IMAGE_SIZE: ${ID_PHOTO_AI_IMAGE_SIZE:-1024x1024}
      ID_PHOTO_AI_IMAGE_QUALITY: ${ID_PHOTO_AI_IMAGE_QUALITY:-high}
      ID_PHOTO_AI_IMAGE_BACKGROUND: ${ID_PHOTO_AI_IMAGE_BACKGROUND:-opaque}
      ID_PHOTO_AI_RESPONSE_FORMAT: ${ID_PHOTO_AI_RESPONSE_FORMAT:-url}
      # AI 生图（可选）。AI_IMAGE_PROVIDERS 与 AI_IMAGE_BASE_URL 都没配时，
      # 生图任务以 AI_IMAGE_NOT_CONFIGURED 失败，页面提示未配置。
      #
      # AI_IMAGE_PROVIDERS 是多来源 JSON 数组（第一项为默认来源），配了它就忽略
      # 下面的单来源变量；页面的「模型平台」选择器只在来源数 >= 2 时出现，
      # 所以不透传这一项时线上只会看到单来源、选择器不显示。
      # 值里有 apiKey，放 .env.prod 并用单引号包住整段 JSON。
      AI_IMAGE_PROVIDERS: ${AI_IMAGE_PROVIDERS:-}
      AI_IMAGE_BASE_URL: ${AI_IMAGE_BASE_URL:-}
      AI_IMAGE_API_KEY: ${AI_IMAGE_API_KEY:-}
      AI_IMAGE_MODEL: ${AI_IMAGE_MODEL:-gpt-image-1}
      AI_IMAGE_RESPONSE_FORMAT: ${AI_IMAGE_RESPONSE_FORMAT:-b64_json}
      AI_IMAGE_LABEL: ${AI_IMAGE_LABEL:-}
      AI_IMAGE_REQUEST_TIMEOUT_MS: ${AI_IMAGE_REQUEST_TIMEOUT_MS:-}
    restart: unless-stopped

  web:
    image: utils-plane:all
    command: ['node', 'server.js']
    ports:
      - '5005:3000'
    depends_on:
      api:
        condition: service_started
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://202.104.149.204:5006}
      NEXT_PUBLIC_S3_PUBLIC_URL: ${NEXT_PUBLIC_S3_PUBLIC_URL:-http://202.104.149.204:5009}
      NEXT_PUBLIC_REQUIRE_EMAIL_VERIFICATION: ${NEXT_PUBLIC_REQUIRE_EMAIL_VERIFICATION:-true}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      NODE_ENV: production
      PORT: 3000
    restart: unless-stopped

volumes:
  pg_data:
  redis_data:
  minio_data:
