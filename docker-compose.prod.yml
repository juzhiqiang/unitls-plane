# 生产环境 Docker Compose
# 使用方式: docker compose -f docker-compose.prod.yml --env-file .env.prod up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: utils-pg-prod
    restart: unless-stopped
    ports:
      - '5007:5432'
    environment:
      POSTGRES_USER: utils
      POSTGRES_PASSWORD: utils
      POSTGRES_DB: utils_plane
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U utils -d utils_plane']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: utils-redis-prod
    restart: unless-stopped
    ports:
      - '5008:6379'
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory-policy noeviction
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: utils-minio-prod
    restart: unless-stopped
    ports:
      - '5009:9000'
      - '5010:9001'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 30s
      timeout: 20s
      retries: 3

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb local/uploads --ignore-existing;
      mc anonymous set download local/uploads;
      exit 0;
      "

  api:
    image: utils-plane:all
    command:
      [
        'sh',
        '-c',
        'node apps/api/dist/scripts/migrate.js && node apps/api/dist/scripts/sync-id-photo-models.js && node apps/api/dist/main.js',
      ]
    ports:
      - '5006:3001'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://utils:utils@postgres:5432/utils_plane
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: uploads
      S3_FORCE_PATH_STYLE: 'true'
      S3_MODELS_BUCKET: ${S3_MODELS_BUCKET:-models}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      REQUIRE_EMAIL_VERIFICATION: ${REQUIRE_EMAIL_VERIFICATION:-true}
      EMAIL_VERIFICATION_CALLBACK_URL: ${EMAIL_VERIFICATION_CALLBACK_URL:-}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://202.104.149.204:5005}
      NODE_ENV: production
      PORT: 3001
      RELEASE: ${RELEASE:-prod}
      BUILD_COMMIT: ${BUILD_COMMIT:-unknown}
      BUILD_TIME: ${BUILD_TIME:-}
    restart: unless-stopped

  web:
    image: utils-plane:all
    command: ['node', 'server.js']
    ports:
      - '5005:3000'
    depends_on:
      api:
        condition: service_started
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://202.104.149.204:5006}
      NEXT_PUBLIC_S3_PUBLIC_URL: ${NEXT_PUBLIC_S3_PUBLIC_URL:-http://202.104.149.204:5009}
      NEXT_PUBLIC_REQUIRE_EMAIL_VERIFICATION: ${NEXT_PUBLIC_REQUIRE_EMAIL_VERIFICATION:-true}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      NODE_ENV: production
      PORT: 3000
    restart: unless-stopped

volumes:
  pg_data:
  redis_data:
  minio_data:
